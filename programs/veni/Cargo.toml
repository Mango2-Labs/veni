[package]
name = "veni"
version = "0.1.0"
description = "Refundable stakes for showing up to events"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "veni"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["event-cpi"] }
anchor-spl = "1.2.0"
# A check-in reads the organizer's signature from the instruction before it.
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
